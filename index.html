<!DOCTYPE html>
<html lang="PT-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Player</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="player">
        
        <div class="titulos" >
            <img src="imagenes/capa.png" alt="capa de musica">
            <h3 id="nome_musica">Nome de Música</h2>
            <p id="nome_artista">Nome Artista</p>
        </div>
        

        <div class="controles">
            <button type="" id="retrasar"><img src="imagenes/rewind-button.png" alt="retrasar"></button>
            <button type="" id="play"><img src="imagenes/play-buttton.png" alt="pause"></button>
            <button type="" id="pause"><img src="imagenes/pause.png" alt="pausa"></button>
            <button type="" id="next"><img src="imagenes/forward-button.png" alt="next"></button>
            
        </div>
        <div class="prograsso">
            <span id="tempoAtual">00:00

            </span>
            <input 
                type="range"
                id="barra"
                min="0" 
                value="0">
            </input>

            <span
                id="duracao"
                >00:00
                
            </span>

        </div>
        <div class="clearfix"></div>
        <footer>
            <small>&copy; Senai 2026 Media Player</small>
        </footer>
    
    </div>
    
</body>

</html>
